<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokechi Companion</title>
  <!-- S1: design tokens first, then this surface's sheet. S9: no inline <style>. -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="../styles/scrollbars.css">
  <link rel="stylesheet" href="../../dist/type-badges.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand">
      <img src="../../media/pokeball.gif" alt="">
      <span>Pokechi</span>
    </div>
    <button id="btn-open-pokedex" class="btn-pokedex" type="button">
      Pokédex ➔
    </button>
  </header>

  <div class="pet-card">
    <div class="sprite-box">
      <img id="popup-sprite" class="is-pokeball" src="../../media/pokeball.gif" alt="">
    </div>
    <div class="pet-info">
      <div class="pet-name-row">
        <span id="popup-name">Pokéball</span>
        <span id="popup-level" class="level-tag">Egg</span>
      </div>
      <div id="popup-types" class="types-row"></div>
      <div class="xp-section">
        <div class="xp-bar-bg">
          <div id="popup-xp-bar" class="xp-bar-fill"></div>
        </div>
        <div class="xp-details">
          <span id="label-xp-progress">XP progress</span>
          <span id="popup-xp-text">0 / 500 XP</span>
        </div>
      </div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-pill">
      <div id="stat-pokedex" class="stat-value">0</div>
      <div id="label-caught" class="stat-label">Caught</div>
    </div>
    <div class="stat-pill">
      <div id="stat-candies" class="stat-value">0</div>
      <div id="label-candies" class="stat-label">Candies</div>
    </div>
    <div class="stat-pill">
      <div id="stat-badges" class="stat-value">0</div>
      <div id="label-badges" class="stat-label">Badges</div>
    </div>
  </div>

  <!-- S4: every row is a <label> tied to its control, so each toggle and
       the slider get their name from the visible text. -->
  <div class="controls">
    <label class="control-row" for="toggle-visible">
      <span id="label-pet-visible">Floating pet</span>
      <span class="toggle">
        <input type="checkbox" id="toggle-visible" checked>
        <span class="slider-toggle"></span>
      </span>
    </label>
    <label class="control-row" for="toggle-newtab">
      <span id="label-newtab">Custom new tab</span>
      <span class="toggle">
        <input type="checkbox" id="toggle-newtab" checked>
        <span class="slider-toggle"></span>
      </span>
    </label>
    <label class="control-row" for="toggle-sound">
      <span id="label-sound">Sounds & cries</span>
      <span class="toggle">
        <input type="checkbox" id="toggle-sound" checked>
        <span class="slider-toggle"></span>
      </span>
    </label>
    <div class="control-row">
      <span class="control-label">
        <label for="range-scale" id="label-scale">Size</label>
        <span id="scale-val">1.0x</span>
      </span>
      <input type="range" id="range-scale" class="scale-range" min="0.6" max="1.5" step="0.1" value="1.0">
    </div>
    <div class="control-row">
      <label for="select-language" id="label-language">Language</label>
      <select id="select-language" class="language-select">
        <option value="en">English</option>
        <option value="es">Español</option>
        <option value="pt">Português</option>
        <option value="fr">Français</option>
        <option value="it">Italiano</option>
        <option value="ko">한국어</option>
        <option value="zh">中文</option>
        <option value="ja">日本語</option>
      </select>
    </div>
  </div>

  <div class="actions">
    <button id="btn-use-candy" class="btn-action" type="button"><img src="../../media/objects/rare-candy.png" alt=""><span id="label-use-candy">Use Candy</span></button>
    <button id="btn-new-pokemon" class="btn-action" type="button"><img src="../../media/pokeball.gif" alt=""><span id="label-new-pokemon">New Pokémon</span></button>
  </div>

  <script src="../../dist/popup.js"></script>
</body>
</html>
