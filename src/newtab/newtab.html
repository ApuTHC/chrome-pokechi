<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva pestaña</title>
  <link rel="icon" type="image/gif" href="../../media/pokeball.gif">
  <!-- S1: design tokens first, then this surface's sheet. S9: no inline <style>. -->
  <link rel="stylesheet" href="../styles/tokens.css">
  <link rel="stylesheet" href="newtab.css">
</head>
<body>
  <!-- S8: the wordmark is the page's <h1> (margin/size reset in newtab.css). -->
  <h1 class="brand">
    <img id="showcase-sprite" src="../../media/pokeball.gif" alt="">
    <span id="showcase-name">Pokechi</span>
  </h1>

  <form id="search-form" class="search-form">
    <!-- S4: explicit label for the search field (visually hidden). -->
    <label class="visually-hidden" for="search-input">Search on Google</label>
    <input id="search-input" type="text" placeholder="Search on Google..." autocomplete="off" autofocus>
    <button type="submit" title="Search" aria-label="Search"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5" stroke-linecap="round"/></svg></button>
  </form>

  <div id="shortcuts" class="shortcuts"></div>

  <footer>Tu compañero Pokémon también vive en esta pestaña</footer>
  <p id="ntp-off-msg">Pestaña personalizada desactivada — actívala en el popup de Pokechi.</p>

  <script src="../../dist/newtab.js"></script>
</body>
</html>
