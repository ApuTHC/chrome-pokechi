<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poké-Dex | Pokechi Companion</title>
  <link rel="stylesheet" href="pokedex.css">
  <link rel="icon" type="image/gif" href="../../media/pokeball.gif">
</head>
<body>
  <main class="pokedex-shell">
    <header class="header">
      <div class="title-block">
        <div class="header-left">
          <img src="../../media/pokeball.gif" alt="Pokechi Logo">
          <div>
            <h1>PokéchiDex</h1>
            <p class="subtitle">Colección de Pokémon descubiertos, insignias y mochila de objetos.</p>
          </div>
        </div>
      </div>
      <div class="counters">
        <div class="counter">
          <span class="counter-value" id="counter-value">0/0</span>
          <span class="counter-label">Descubiertos</span>
        </div>
        <div class="counter">
          <span class="counter-value" id="shiny-counter-value">0/0</span>
          <span class="counter-label">Shiny</span>
        </div>
        <div class="counter">
          <span class="counter-value" id="badge-counter-value">0/0</span>
          <span class="counter-label">Insignias</span>
        </div>
        <div class="counter">
          <span class="counter-value" id="total-xp-value">0</span>
          <span class="counter-label">XP Total</span>
        </div>
        <button type="button" class="counter counter-candy" id="candy-counter" disabled>
          <img class="counter-candy-icon" id="candy-counter-icon" alt="">
          <span class="counter-value" id="candy-counter-value">0</span>
          <span class="counter-label" id="candy-counter-label">Caramelo</span>
        </button>
      </div>
    </header>

    <section class="bag-accordion">
      <button type="button" class="bag-toggle" id="bag-toggle" aria-expanded="false" aria-controls="bag-content">
        <span class="bag-chevron">&#9656;</span>
        Mochila
      </button>
      <div class="bag-content" id="bag-content" hidden>
        <div class="bag-tabs" role="tablist">
          <button type="button" class="bag-tab is-selected" data-bag-tab="items" role="tab" aria-selected="true">Objetos</button>
          <button type="button" class="bag-tab" data-bag-tab="badges" role="tab" aria-selected="false">Insignias</button>
        </div>
        <div class="bag-panel bag-panel-items" data-bag-tabpanel="items" id="bag-panel-items">
          <div class="item-row-wrapper">
            <div class="item-row" id="items-container"></div>
          </div>
        </div>
        <div class="bag-panel bag-panel-badges" data-bag-tabpanel="badges" id="bag-panel-badges" hidden>
          <div class="badge-gen-tabs" role="tablist" id="badge-gen-tabs">
            <button type="button" class="badge-gen-tab is-selected" data-badge-gen="1" role="tab" aria-selected="true">Gen 1 (Kanto)</button>
            <button type="button" class="badge-gen-tab" data-badge-gen="2" role="tab" aria-selected="false">Gen 2 (Johto)</button>
            <button type="button" class="badge-gen-tab" data-badge-gen="3" role="tab" aria-selected="false">Gen 3 (Hoenn)</button>
            <button type="button" class="badge-gen-tab" data-badge-gen="4" role="tab" aria-selected="false">Gen 4 (Sinnoh)</button>
          </div>
          <div class="badge-row-wrapper" id="badge-row-wrapper"></div>
        </div>
      </div>
    </section>

    <div class="toolbar">
      <input
        id="search"
        class="search"
        type="search"
        placeholder="Buscar por nombre o número..."
        aria-label="Buscar Pokémon"
        autocomplete="off"
      />
      <div class="filters" role="group" aria-label="Filtros">
        <button type="button" class="filter-chip is-selected" data-generation="all">Todas</button>
        <button type="button" class="filter-chip" data-generation="1">Gen 1</button>
        <button type="button" class="filter-chip" data-generation="2">Gen 2</button>
        <button type="button" class="filter-chip" data-generation="3">Gen 3</button>
        <button type="button" class="filter-chip" data-generation="4">Gen 4</button>
        <div class="type-filter">
          <button
            type="button"
            class="filter-chip type-filter-toggle"
            id="type-filter-toggle"
            aria-haspopup="true"
            aria-expanded="false"
          >Tipos<span class="type-filter-count" id="type-filter-count" hidden></span>
          </button>
          <div class="type-filter-menu" id="type-filter-menu" role="group" aria-label="Filtrar por tipo" hidden>
          </div>
        </div>
        <label class="filter-toggle">
          <input type="checkbox" id="only-discovered" />
          Solo descubiertos
        </label>
        <label class="filter-toggle">
          <input type="checkbox" id="only-shiny" />
          Solo Shiny
        </label>
      </div>
    </div>

    <p class="empty-state" id="empty-state" hidden>Ningún Pokémon coincide con los filtros.</p>

    <section class="grid" id="pokedex-grid" aria-label="Pokédex"></section>
  </main>

  <script src="../../dist/pokedex.js"></script>
</body>
</html>
